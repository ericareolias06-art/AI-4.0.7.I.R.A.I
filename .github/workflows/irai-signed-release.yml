name: Irai signed APK and Play Store AAB

# Build signed APK and AAB on Android source changes or explicit manual request.
# Generated artifacts require a separate, deliberate upload to Google Play.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/irai-hybrid-ai
    paths:
      - '.github/workflows/irai-signed-release.yml'
      - 'irai-android/app/src/main/**'
      - 'irai-android/app/build.gradle.kts'

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify secret configuration and upload certificate
        env:
          IRAI_UPLOAD_KEYSTORE_BASE64: ${{ secrets.IRAI_UPLOAD_KEYSTORE_BASE64 }}
          IRAI_UPLOAD_STORE_PASSWORD: ${{ secrets.IRAI_UPLOAD_STORE_PASSWORD }}
          IRAI_UPLOAD_KEY_ALIAS: ${{ secrets.IRAI_UPLOAD_KEY_ALIAS }}
          IRAI_UPLOAD_KEY_PASSWORD: ${{ secrets.IRAI_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in IRAI_UPLOAD_KEYSTORE_BASE64 IRAI_UPLOAD_STORE_PASSWORD IRAI_UPLOAD_KEY_ALIAS IRAI_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $variable"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/irai-upload-signing.jks"
          printf '%s' "$IRAI_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "IRAI_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          cert_info="$(keytool -list -v -keystore "$KEYSTORE" -alias "$IRAI_UPLOAD_KEY_ALIAS" -storepass "$IRAI_UPLOAD_STORE_PASSWORD" -keypass "$IRAI_UPLOAD_KEY_PASSWORD")"
          actual="$(printf '%s\n' "$cert_info" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1 | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="64:F2:1C:73:69:A5:0E:57:E1:D7:13:B0:C4:F7:A1:79:2B:03:A2:29"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::Upload certificate SHA-1 does not match the expected certificate registered in Google Play. Verify the keystore or complete the upload-key reset."
            echo "Actual certificate fingerprint: $actual"
            exit 1
          fi
          echo "Upload signing certificate fingerprint verified."
      - name: Build signed release APK and bundle
        working-directory: irai-android
        env:
          IRAI_UPLOAD_STORE_PASSWORD: ${{ secrets.IRAI_UPLOAD_STORE_PASSWORD }}
          IRAI_UPLOAD_KEY_ALIAS: ${{ secrets.IRAI_UPLOAD_KEY_ALIAS }}
          IRAI_UPLOAD_KEY_PASSWORD: ${{ secrets.IRAI_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ORG_GRADLE_PROJECT_IRAI_UPLOAD_STORE_FILE="$IRAI_KEYSTORE_PATH" \
          ORG_GRADLE_PROJECT_IRAI_UPLOAD_STORE_PASSWORD="$IRAI_UPLOAD_STORE_PASSWORD" \
          ORG_GRADLE_PROJECT_IRAI_UPLOAD_KEY_ALIAS="$IRAI_UPLOAD_KEY_ALIAS" \
          ORG_GRADLE_PROJECT_IRAI_UPLOAD_KEY_PASSWORD="$IRAI_UPLOAD_KEY_PASSWORD" \
          ./gradlew --no-daemon assembleRelease bundleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: IraiTec-signed-release-APK
          path: irai-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: IraiTec-PlayStore-signed-AAB
          path: irai-android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: |
          if [[ -n "${IRAI_KEYSTORE_PATH:-}" ]]; then
            rm -f -- "$IRAI_KEYSTORE_PATH"
          fi
