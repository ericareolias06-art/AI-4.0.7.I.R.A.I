name: Irai Android hybrid build

on:
  pull_request:
    paths:
      - 'irai-android/**'
      - '.github/workflows/hybrid-android-build.yml'
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enforce local-only Android AI
        run: |
          if grep -R --include='*.kt' -n '/api/ai/chat' irai-android/app/src/main/java; then
            echo "Cloud AI endpoint was referenced in Android source" >&2
            exit 1
          fi
      - name: Build debug APK and AAB
        working-directory: irai-android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug bundleDebug
      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IraiTec-hybrid-debug
          path: irai-android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Upload test AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IraiTec-debug-AAB
          path: irai-android/app/build/outputs/bundle/debug/*.aab
          retention-days: 7
