name: Build Irai Tec Play AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "irai-android/**"
      - ".github/workflows/android-release-aab.yml"

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Restore signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.IRAI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > irai-android/app/upload-key.jks
          fi
      - name: Build release bundle
        working-directory: irai-android
        env:
          STORE_PASSWORD: ${{ secrets.IRAI_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IRAI_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IRAI_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f app/upload-key.jks ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            ./gradlew --no-daemon bundleRelease -PIRAI_UPLOAD_STORE_FILE=upload-key.jks -PIRAI_UPLOAD_STORE_PASSWORD="$STORE_PASSWORD" -PIRAI_UPLOAD_KEY_ALIAS="$KEY_ALIAS" -PIRAI_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"
          else
            echo "Signing secrets missing; generating UNSIGNED bundle (not Play-uploadable)."
            ./gradlew --no-daemon bundleRelease
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: IraiTec-v6-release-aab
          path: irai-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
