name: Build Irai Tec Play AAB

on:
  workflow_dispatch:
  push:
    branches: [main, feature/irai-device-only-stability]
    paths:
      - "irai-android/**"
      - ".github/workflows/android-release-aab.yml"

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Restore signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.IRAI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > irai-android/app/upload-key.jks
          fi
      - name: Build release bundle
        working-directory: irai-android
        env:
          STORE_PASSWORD: ${{ secrets.IRAI_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IRAI_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IRAI_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f app/upload-key.jks ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            ./gradlew --no-daemon bundleRelease -PIRAI_UPLOAD_STORE_FILE=upload-key.jks -PIRAI_UPLOAD_STORE_PASSWORD="$STORE_PASSWORD" -PIRAI_UPLOAD_KEY_ALIAS="$KEY_ALIAS" -PIRAI_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"
          else
            echo "::error::Release signing secrets are missing. Refusing to publish an unsigned Play AAB."
            exit 1
          fi
      - name: Verify signed bundle before publishing
        if: github.ref_name == 'feature/irai-device-only-stability'
        working-directory: irai-android
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          SHA1=$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -1)
          test "$SHA1" = "64:F2:1C:73:69:A5:0E:57:E1:D7:13:B0:C4:F7:A1:79:2B:03:A2:29"
          for lib in core android; do
            test "$(unzip -p "$AAB" "base/root/META-INF/kotlinx_coroutines_${lib}.version" | tr -d '\r\n')" = "1.11.0"
          done
          curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o /tmp/bundletool.jar
          test "$(java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --xpath='/manifest/@android:versionCode' | tr -d '[:space:]')" = "18"
          sha256sum "$AAB"
      - uses: actions/upload-artifact@v4
        with:
          name: IraiTec-signed-release-aab
          path: irai-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
