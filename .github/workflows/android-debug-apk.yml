name: Build Irai Tec Android APK and AAB

on:
  push:
    branches: [main]
    paths:
      - "irai-android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Build debug APK
        working-directory: irai-android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Build release Android App Bundle
        working-directory: irai-android
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload release AAB (unsigned without upload key)
        uses: actions/upload-artifact@v4
        with:
          name: IraiTec-v5-release-aab-unsigned
          path: irai-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IraiTec-debug-apk
          path: irai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
