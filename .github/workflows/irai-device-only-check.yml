name: Irai device-only Android check

on:
  push:
    branches:
      - feature/irai-device-only-stability
  pull_request:
    paths:
      - 'irai-android/**'
      - '.github/workflows/irai-device-only-check.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build unsigned debug APK
        working-directory: irai-android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
