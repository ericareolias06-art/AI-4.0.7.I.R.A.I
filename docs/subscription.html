
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irai Tec Premium</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="login-box">
        <h1>Irai Tec Premium</h1>
        <p>Choose a plan to unlock Premium access.</p>

        <section>
            <h2>Monthly Premium</h2>
            <p>$3 per month</p>
            <button id="monthlyButton" type="button">
                Subscribe Monthly
            </button>
        </section>

        <section>
            <h2>Yearly Premium</h2>
            <p>$30 per year — save $6 annually!</p>
            <button id="yearlyButton" type="button">
                Subscribe Yearly
            </button>
        </section>

        <hr>

        <form id="promoForm">
            <label for="promoCode">Have a promo code?</label>
            <input
                type="text"
                id="promoCode"
                placeholder="Enter promo code"
                autocomplete="off"
                required
            >
            <button type="submit">Activate Free Premium</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <button id="continueButton" type="button" hidden>
            Continue to Irai Tec
        </button>
    </main>

    <script src="subscription.js" defer></script>
</body>
</html>
