<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Account Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script defer>
      document.querySelectorAll('.password-visibility').forEach(toggle => {
        toggle.addEventListener('change', () => {
          const field = document.getElementById(toggle.dataset.target);
          if (field) field.type = toggle.checked ? 'text' : 'password';
        });
      });
    </script>
</head>
<body>
    <main class="login-box">
        <h1>Welcome</h1>
        <p>Sign In to your Irai Tec Account</p>

        <form id="loginForm">
           <input type="email" id="email" placeholder="Email" required>
           <input type="password" id="password" placeholder="Password" required>
           <label style="display:block;margin:6px 0 12px;cursor:pointer"><input type="checkbox" class="password-visibility" data-target="password"> Show password</label>
           <button type="submit">Sign In</button>
        </form>
        <form id="registerForm" hidden>
           <input type="email" id="newEmail" placeholder="Email" required>
           <input type="password" id="newPassword" placeholder="Create Password" minlength="12" required>
           <label style="display:block;margin:6px 0 12px;cursor:pointer"><input type="checkbox" class="password-visibility" data-target="newPassword"> Show password</label>
           <input type="password" id="newPasswordConfirm" placeholder="Confirm Password" minlength="12" required>
           <label style="display:block;margin:6px 0 12px;cursor:pointer"><input type="checkbox" class="password-visibility" data-target="newPasswordConfirm"> Show confirm password</label>
           <button type="submit">Create Account</button>
        </form>
        <p id="message"></p>
        <button id="toggleForm">Don't have an account? Register</button>
    </main>
<footer style="text-align:center;padding:24px;font:14px system-ui;color:#aaa"><a href="./privacy.html" style="color:#b8a6ff">Privacy Policy</a> · <a href="./delete-account.html" style="color:#b8a6ff">Delete Account</a></footer>
</body>
</html>
